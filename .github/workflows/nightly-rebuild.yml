name: Nightly Site Rebuild

on:
  schedule:
    # 12:30 AM Mountain Standard Time (MST) = 7:30 AM UTC
    # Note: During daylight saving time (MDT), this runs at 1:30 AM local time
    - cron: '30 7 * * *'

  # Manual trigger for testing
  workflow_dispatch:

jobs:
  rebuild:
    uses: ./.github/workflows/jekyll.yml
    permissions:
      contents: read
      pages: write
      id-token: write
